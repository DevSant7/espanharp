<script>
  // Escuta eventos do FiveM
  window.addEventListener('message', function(event) {
      var data = event.data;
      if (data.type === 'refreshBanking' || data.action === 'refreshBanking') {
          // Força o refresh da UI Vue
          if (window.bankingApp && window.bankingApp.refreshData) {
              window.bankingApp.refreshData();
          } else {
              // Se não tiver a função, recarrega a página
              location.reload();
          }
      }
  });
</script>
